name: Publish to npm

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: yarn

            - name: Check that tag matches package version
              run: |
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi

            - run: yarn install --frozen-lockfile

            - run: yarn lint

            # Authenticates via npm trusted publishing (configure this repo + workflow in the package settings on npmjs.com).
            - run: npm publish --provenance
